<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="364" viewBox="0 0 1200 364"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">syrup-agent</title>
  <desc id="hero-desc">A local-first AI assistant built on four pillars — Harness, Loop, Memory, Eval/LLM-Ops — with a live terminal transcript of its retrieval gate deciding skip vs. retrieve.</desc>

  <defs>
    <clipPath id="hero-clip"><rect width="1200" height="364" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="364" fill="#101012"/>
    <rect width="1200" height="364" fill="none" stroke="#1c1c1f" stroke-width="1"/>
  </g>

  <!-- ============ LEFT: identity ============ -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="56" y="60" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="18" letter-spacing="3" fill="#8d8c96">LOCAL-FIRST AI ASSISTANT</text>

    <text x="56" y="122" font-size="54" font-weight="700" fill="#ececea">syrup-agent</text>

    <text x="56" y="164" font-size="22" fill="#a9a8b3">Your own personal AI assistant —</text>
    <text x="56" y="194" font-size="22" fill="#a9a8b3">in code you can read in an afternoon.</text>

    <!-- pillar chips: the four boxes from the architecture diagram -->
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="18" text-anchor="middle">
      <rect x="56" y="232" width="112" height="34" rx="8" fill="#18181b" stroke="#2c2c31"/>
      <text x="112" y="255" fill="#d8d7de">HARNESS</text>

      <text x="186" y="255" fill="#45454b" text-anchor="middle" font-size="16">&#8250;</text>

      <rect x="204" y="232" width="78" height="34" rx="8" fill="#18181b" stroke="#2c2c31"/>
      <text x="243" y="255" fill="#d8d7de">LOOP</text>

      <text x="300" y="255" fill="#45454b" text-anchor="middle" font-size="16">&#8250;</text>

      <rect x="318" y="232" width="104" height="34" rx="8" fill="#18181b" stroke="#2c2c31"/>
      <text x="370" y="255" fill="#d8d7de">MEMORY</text>

      <text x="440" y="255" fill="#45454b" text-anchor="middle" font-size="16">&#8250;</text>

      <rect x="458" y="232" width="142" height="34" rx="8" fill="#18181b" stroke="#2c2c31"/>
      <text x="529" y="255" fill="#d8d7de">EVAL / OPS</text>
    </g>

    <!-- first command, verbatim from Quickstart -->
    <text x="56" y="326" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="20">
      <tspan fill="#5f5e66">$ </tspan><tspan fill="#ececea">uv run syrup</tspan>
    </text>
    <rect x="234" y="310" width="11" height="20" fill="#5f5e66"/>
  </g>

  <!-- ============ RIGHT: real proof — the retrieval-gate terminal ============ -->
  <g>
    <rect x="700" y="56" width="444" height="228" rx="12" fill="#18181b" stroke="#333338"/>
    <line x1="700" y1="90" x2="1144" y2="90" stroke="#2a2a2f"/>
    <circle cx="722" cy="73" r="4" fill="#3a3a40"/>
    <circle cx="738" cy="73" r="4" fill="#3a3a40"/>
    <circle cx="754" cy="73" r="4" fill="#3a3a40"/>
    <text x="1128" y="77" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="13" fill="#5f5e66">gate.log</text>

    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="19">
      <text x="724" y="132" fill="#ececea">you &#8250; what&#8217;s 2+2?</text>
      <text x="748" y="162"><tspan fill="#6f6e69">gate &#183; skip &#8212; pure math</tspan></text>

      <text x="724" y="204" fill="#ececea">you &#8250; when am I meeting Alex?</text>
      <text x="748" y="234"><tspan fill="#6f6e69">gate &#183; </tspan><tspan fill="#7c8aec">retrieve</tspan></text>
      <text x="748" y="260"><tspan fill="#6f6e69">&#8212; references user&#8217;s plans</tspan></text>
    </g>
  </g>

  <text x="700" y="300" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" fill="#5f5e66">hero moment #1 &#8212; skip vs. retrieve</text>
</svg>
