<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="700" viewBox="0 0 1200 700"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">syrup-agent architecture</title>
  <desc id="arch-desc">One message end to end: a gateway hands text to working memory, the loop reasons and calls tools, the reply goes back out the same door. Below, the memory pillar stores the turn, a retrieval gate decides whether the next turn needs memory at all, and consolidation turns chats into facts. At the bottom, LLM Ops traces every turn, scores it with two kinds of eval, and gates the release.</desc>

  <defs>
    <clipPath id="arch-clip"><rect width="1200" height="700" rx="22"/></clipPath>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6b6a73"/>
    </marker>
  </defs>

  <g clip-path="url(#arch-clip)">
    <rect width="1200" height="700" fill="#101012"/>
    <rect width="1200" height="700" fill="none" stroke="#1c1c1f" stroke-width="1"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">

    <text x="48" y="52" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="14" letter-spacing="3" fill="#5f5e66">SYRUP-AGENT &#183; ONE MESSAGE, END TO END</text>

    <!-- ============ BAND A — the turn ============ -->

    <!-- gateway -->
    <rect x="48" y="136" width="198" height="132" rx="12" fill="#18181b" stroke="#2c2c31"/>
    <text x="72" y="172" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="15" letter-spacing="2" fill="#ececea">GATEWAY</text>
    <text x="72" y="200" font-size="13" fill="#a9a8b3">terminal &#183; dashboard</text>
    <text x="72" y="220" font-size="13" fill="#a9a8b3">voice &#183; telegram &#183; discord</text>
    <text x="72" y="240" font-size="13" fill="#a9a8b3">whatsapp &#183; dingtalk &#183; feishu</text>
    <text x="72" y="259" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="11" fill="#5f5e66">syrup/gateway/</text>

    <!-- working memory -->
    <rect x="290" y="136" width="206" height="132" rx="12" fill="#18181b" stroke="#2c2c31"/>
    <text x="314" y="172" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="15" letter-spacing="2" fill="#ececea">WORKING MEMORY</text>
    <text x="314" y="200" font-size="13" fill="#a9a8b3">SOUL.md &#8212; who it is</text>
    <text x="314" y="220" font-size="13" fill="#a9a8b3">+ facts worth recalling</text>
    <text x="314" y="240" font-size="13" fill="#a9a8b3">+ the recent turns</text>
    <text x="314" y="259" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="11" fill="#5f5e66">runtime/session.py</text>

    <!-- the loop -->
    <rect x="540" y="104" width="400" height="196" rx="14" fill="#141416" stroke="#333338"/>
    <text x="566" y="136" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="14" letter-spacing="2" fill="#7c8aec">THE LOOP</text>
    <text x="914" y="136" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="11" fill="#5f5e66">loop/agent.py &#183; ~95 lines</text>

    <rect x="566" y="150" width="348" height="60" rx="10" fill="#18181b" stroke="#2c2c31"/>
    <text x="740" y="176" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="15" letter-spacing="1" fill="#ececea">LLM</text>
    <text x="740" y="196" text-anchor="middle" font-size="12" fill="#8d8c96">works out what to do next</text>

    <rect x="566" y="234" width="348" height="60" rx="10" fill="#18181b" stroke="#2c2c31"/>
    <text x="740" y="260" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="15" letter-spacing="1" fill="#ececea">TOOLS</text>
    <text x="740" y="280" text-anchor="middle" font-size="12" fill="#8d8c96">create_event &#183; list_events &#183; search_web &#183; save_note</text>

    <path d="M 640 212 V 228" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <text x="652" y="226" font-size="11" fill="#8d8c96">call a tool</text>
    <path d="M 840 232 V 216" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <text x="828" y="226" text-anchor="end" font-size="11" fill="#8d8c96">read the result</text>

    <!-- reply -->
    <rect x="984" y="170" width="168" height="64" rx="12" fill="#18181b" stroke="#2c2c31"/>
    <text x="1068" y="197" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="15" letter-spacing="2" fill="#ececea">REPLY</text>
    <text x="1068" y="217" text-anchor="middle" font-size="12" fill="#8d8c96">out the same door</text>

    <!-- band A arrows -->
    <path d="M 246 202 H 282" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 496 202 H 532" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 940 202 H 976" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 1068 170 V 86 H 147 V 130" stroke="#6b6a73" stroke-width="1.4" fill="none"
          marker-end="url(#ar)"/>
    <text x="600" y="78" text-anchor="middle" font-size="11" fill="#8d8c96">the answer travels back the way it came</text>

    <!-- ============ BAND B — memory ============ -->

    <!-- legend -->
    <rect x="48" y="356" width="198" height="120" rx="12" fill="#141416" stroke="#26262b"/>
    <text x="72" y="386" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12" letter-spacing="2" fill="#8d8c96">HOW TO READ</text>
    <path d="M 72 408 H 102" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <text x="114" y="412" font-size="11.5" fill="#a9a8b3">every turn</text>
    <path d="M 72 436 H 102" stroke="#6b6a73" stroke-width="1.4" stroke-dasharray="4 4"
          fill="none" marker-end="url(#ar)"/>
    <text x="114" y="440" font-size="11.5" fill="#a9a8b3">only sometimes</text>
    <text x="72" y="464" font-size="11.5" fill="#5f5e66">each box is real code</text>

    <!-- retrieval gate -->
    <rect x="290" y="356" width="206" height="120" rx="12" fill="#18181b" stroke="#2c2c31"/>
    <text x="314" y="388" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="15" letter-spacing="2" fill="#ececea">RETRIEVAL GATE</text>
    <text x="314" y="414" font-size="13" fill="#a9a8b3">does this message need</text>
    <text x="314" y="432" font-size="13" fill="#a9a8b3">memory at all?</text>
    <text x="314" y="454" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12">
      <tspan fill="#8d8c96">skip</tspan><tspan fill="#45454b">  &#183;  </tspan><tspan fill="#7c8aec">retrieve</tspan>
    </text>
    <text x="314" y="470" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="11" fill="#5f5e66">memory/retrieval_gate.py</text>

    <!-- memory store -->
    <rect x="540" y="356" width="400" height="120" rx="12" fill="#18181b" stroke="#2c2c31"/>
    <text x="564" y="388" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="15" letter-spacing="2" fill="#e0a458">MEMORY</text>
    <text x="916" y="388" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="11" fill="#5f5e66">.syrup/state.db &#183; SQLite + FTS5</text>

    <rect x="564" y="404" width="112" height="34" rx="8" fill="#1e1e22" stroke="#2c2c31"/>
    <text x="620" y="426" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12" fill="#d8d7de">SEMANTIC</text>
    <rect x="688" y="404" width="112" height="34" rx="8" fill="#1e1e22" stroke="#2c2c31"/>
    <text x="744" y="426" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12" fill="#d8d7de">EPISODIC</text>
    <rect x="812" y="404" width="112" height="34" rx="8" fill="#1e1e22" stroke="#2c2c31"/>
    <text x="868" y="426" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12" fill="#d8d7de">PROCEDURAL</text>

    <text x="620" y="460" text-anchor="middle" font-size="11" fill="#8d8c96">facts</text>
    <text x="744" y="460" text-anchor="middle" font-size="11" fill="#8d8c96">what happened</text>
    <text x="868" y="460" text-anchor="middle" font-size="11" fill="#8d8c96">skills</text>

    <!-- consolidation -->
    <rect x="984" y="356" width="168" height="120" rx="12" fill="#18181b" stroke="#2c2c31"/>
    <text x="1008" y="388" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="14" letter-spacing="1.5" fill="#ececea">CONSOLIDATE</text>
    <text x="1008" y="414" font-size="12.5" fill="#a9a8b3">every N chats,</text>
    <text x="1008" y="432" font-size="12.5" fill="#a9a8b3">turns become facts</text>
    <text x="1008" y="464" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="11" fill="#5f5e66">memory/consolidation.py</text>

    <!-- band B arrows -->
    <path d="M 393 356 V 274" stroke="#6b6a73" stroke-width="1.4" stroke-dasharray="4 4"
          fill="none" marker-end="url(#ar)"/>
    <text x="405" y="322" font-size="11" fill="#8d8c96">only if it does</text>
    <path d="M 540 400 H 502" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 940 392 H 978" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 984 442 H 946" stroke="#6b6a73" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 1068 234 V 326 H 740 V 350" stroke="#6b6a73" stroke-width="1.4" stroke-dasharray="4 4"
          fill="none" marker-end="url(#ar)"/>
    <text x="1050" y="318" text-anchor="end" font-size="11" fill="#8d8c96">the turn is written down</text>

    <!-- ============ BAND C — LLM Ops ============ -->

    <rect x="48" y="536" width="1104" height="124" rx="14" fill="#141416" stroke="#26262b"/>
    <text x="76" y="568" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="14" letter-spacing="2" fill="#ececea">LLM OPS</text>
    <text x="176" y="568" font-size="12.5" fill="#8d8c96">&#8212; watch every turn, score it, then decide it is fit to ship</text>
    <text x="1124" y="568" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="11" fill="#5f5e66">syrup/ops/ &#183; evals/</text>

    <rect x="76" y="590" width="244" height="48" rx="10" fill="#18181b" stroke="#2c2c31"/>
    <text x="94" y="610" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12.5" letter-spacing="1" fill="#d8d7de">TRACE</text>
    <text x="94" y="628" font-size="11.5" fill="#8d8c96">every turn, in order, to .jsonl</text>

    <rect x="344" y="590" width="244" height="48" rx="10" fill="#18181b" stroke="#2c2c31"/>
    <text x="362" y="610" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12.5" letter-spacing="1" fill="#d8d7de">EVAL &#183; DETERMINISTIC</text>
    <text x="362" y="628" font-size="11.5" fill="#8d8c96">did the right tool fire? 0 or 1</text>

    <rect x="612" y="590" width="244" height="48" rx="10" fill="#18181b" stroke="#2c2c31"/>
    <text x="630" y="610" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12.5" letter-spacing="1" fill="#d8d7de">EVAL &#183; JUDGED</text>
    <text x="630" y="628" font-size="11.5" fill="#8d8c96">was the reply any good? a score</text>

    <rect x="880" y="590" width="244" height="48" rx="10" fill="#18181b" stroke="#2c2c31"/>
    <text x="898" y="610" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="12.5" letter-spacing="1" fill="#7c8aec">RELEASE GATE</text>
    <text x="898" y="628" font-size="11.5" fill="#8d8c96">both must pass, or it does not ship</text>

    <text x="332" y="619" text-anchor="middle" font-size="14" fill="#45454b">&#8250;</text>
    <text x="600" y="619" text-anchor="middle" font-size="14" fill="#45454b">&#8250;</text>
    <text x="868" y="619" text-anchor="middle" font-size="14" fill="#45454b">&#8250;</text>

    <path d="M 270 536 V 248 H 284" stroke="#6b6a73" stroke-width="1.4" stroke-dasharray="4 4"
          fill="none" marker-end="url(#ar)"/>
    <text x="290" y="518" font-size="11" fill="#8d8c96">what you learn here comes back as a better prompt</text>
  </g>
</svg>
