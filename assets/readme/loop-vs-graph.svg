<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="616" viewBox="0 0 1200 616"
     role="img" aria-labelledby="lvg-title lvg-desc">
  <title id="lvg-title">Loop 是一条路，Graph 是一张步骤地图</title>
  <desc id="lvg-desc">左边是 Loop：Reason、Act、Observe，一条路反复走，直到它能回答。右边是 Triage graph：classify 用小模型给消息分类，check_calendar 同时从磁盘读今天的日历，两件事并行；route 按确定性规则决定走哪条边 —— 小聊天交给 quick_reply，真活儿交给 full_agent，也就是左边那个 Loop 作为 Graph 里的一个节点在跑。任何一步出问题都回退到普通 Loop。</desc>

  <defs>
    <clipPath id="lvg-clip"><rect width="1200" height="616" rx="20"/></clipPath>
    <marker id="lv-arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8f8e89"/>
    </marker>
  </defs>

  <g clip-path="url(#lvg-clip)">
    <rect width="1200" height="616" fill="#fafaf9"/>
    <rect x="0.5" y="0.5" width="1199" height="615" rx="20" fill="none" stroke="#e7e6e4"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">

    <text x="48" y="66" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="17" letter-spacing="3" fill="#a3a29d">TWO WAYS TO RUN A TURN</text>
    <text x="404" y="66" font-size="18" fill="#a3a29d">—— Loop 是默认的那条路，Graph 是可选的形状</text>

    <!-- ==================== 左：循环 ==================== -->
    <rect x="48" y="96" width="472" height="474" rx="16" fill="#ffffff" stroke="#e7e6e4"/>
    <text x="76" y="140" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="18" letter-spacing="3" fill="#5e6ad2">LOOP</text>
    <text x="76" y="170" font-size="18" fill="#6f6e69">一条路，反复走</text>

    <rect x="168" y="208" width="232" height="84" rx="12" fill="#fafaf9" stroke="#e7e6e4"/>
    <text x="192" y="246" font-size="22" font-weight="600" fill="#21201d">Reason</text>
    <text x="192" y="274" font-size="18" fill="#6f6e69">下一步该做什么</text>

    <path d="M 284 294 V 318" fill="none" stroke="#8f8e89" stroke-width="1.4"
          marker-end="url(#lv-arrow)"/>

    <rect x="168" y="324" width="232" height="84" rx="12" fill="#fafaf9" stroke="#e7e6e4"/>
    <text x="192" y="362" font-size="22" font-weight="600" fill="#21201d">Act</text>
    <text x="192" y="390" font-size="18" fill="#6f6e69">调一个工具</text>

    <path d="M 284 410 V 434" fill="none" stroke="#8f8e89" stroke-width="1.4"
          marker-end="url(#lv-arrow)"/>

    <rect x="168" y="440" width="232" height="84" rx="12" fill="#fafaf9" stroke="#e7e6e4"/>
    <text x="192" y="478" font-size="22" font-weight="600" fill="#21201d">Observe</text>
    <text x="192" y="506" font-size="18" fill="#6f6e69">看回来了什么</text>

    <path d="M 168 482 H 124 V 250 H 164" fill="none" stroke="#8f8e89"
          stroke-width="1.4" marker-end="url(#lv-arrow)"/>
    <text x="112" y="366" text-anchor="middle" font-size="18" fill="#a3a29d"
          transform="rotate(-90 112 366)">直到它能回答</text>

    <text x="168" y="556" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="16" fill="#a3a29d">loop/agent.py · run_loop 约 95 行</text>

    <!-- ==================== 右：图工作流 ==================== -->
    <rect x="552" y="96" width="600" height="474" rx="16" fill="#ffffff" stroke="#e7e6e4"/>
    <text x="580" y="140" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="18" letter-spacing="3" fill="#b0870f">GRAPH · TRIAGE</text>
    <text x="580" y="170" font-size="18" fill="#6f6e69">一张步骤地图：有些步骤同时跑，有一条边负责决定</text>

    <rect x="580" y="259" width="92" height="48" rx="24" fill="#fafaf9" stroke="#d9d8d5"/>
    <text x="626" y="290" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="17" letter-spacing="1" fill="#6f6e69">START</text>

    <path d="M 672 283 H 692 V 232 H 700" fill="none" stroke="#8f8e89"
          stroke-width="1.4" marker-end="url(#lv-arrow)"/>
    <path d="M 692 283 V 334 H 700" fill="none" stroke="#8f8e89"
          stroke-width="1.4" marker-end="url(#lv-arrow)"/>

    <rect x="708" y="190" width="228" height="84" rx="12" fill="#fafaf9" stroke="#e7e6e4"/>
    <text x="732" y="228" font-size="22" font-weight="600" fill="#21201d">classify</text>
    <text x="732" y="256" font-size="18" fill="#6f6e69">小模型给消息分类</text>

    <rect x="708" y="292" width="228" height="84" rx="12" fill="#fafaf9" stroke="#e7e6e4"/>
    <text x="732" y="330" font-size="22" font-weight="600" fill="#21201d">check_calendar</text>
    <text x="732" y="358" font-size="18" fill="#6f6e69">本地一次读，同时进行</text>

    <path d="M 936 232 L 982 271" fill="none" stroke="#8f8e89" stroke-width="1.4"
          marker-end="url(#lv-arrow)"/>
    <path d="M 936 334 L 982 295" fill="none" stroke="#8f8e89" stroke-width="1.4"
          marker-end="url(#lv-arrow)"/>

    <path d="M 1064 237 L 1140 283 L 1064 329 L 988 283 Z" fill="#ffffff"
          stroke="#b0870f" stroke-width="1.6"/>
    <text x="1064" y="290" text-anchor="middle" font-size="22" font-weight="600" fill="#21201d">route</text>

    <path d="M 1064 329 V 410 H 690 V 424" fill="none" stroke="#8f8e89"
          stroke-width="1.4" marker-end="url(#lv-arrow)"/>
    <path d="M 1064 329 V 410 H 1014 V 424" fill="none" stroke="#8f8e89"
          stroke-width="1.4" marker-end="url(#lv-arrow)"/>
    <text x="702" y="402" font-size="18" fill="#a3a29d">“谢谢！”</text>
    <text x="1002" y="402" text-anchor="end" font-size="18" fill="#a3a29d">“周六安排个游泳”</text>

    <rect x="580" y="430" width="220" height="94" rx="12" fill="#fafaf9" stroke="#e7e6e4"/>
    <text x="602" y="466" font-size="22" font-weight="600" fill="#21201d">quick_reply</text>
    <text x="602" y="492" font-size="18" fill="#6f6e69">小模型答完就走</text>
    <text x="602" y="516" font-size="18" fill="#a3a29d">大模型根本没醒</text>

    <rect x="904" y="430" width="220" height="94" rx="12" fill="#ffffff" stroke="#5e6ad2" stroke-width="1.6"/>
    <text x="926" y="466" font-size="22" font-weight="600" fill="#5e6ad2">full_agent</text>
    <text x="926" y="492" font-size="18" fill="#6f6e69">就是左边那个 Loop</text>
    <text x="926" y="516" font-size="18" fill="#a3a29d">Graph 里的一个节点</text>

    <text x="580" y="556" font-family="ui-monospace,'SF Mono',Menlo,monospace"
          font-size="16" fill="#a3a29d">graph/ · 任何一步出问题 → 回退到普通 Loop</text>
  </g>
</svg>
